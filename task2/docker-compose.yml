version: '3.9'

services:
  collector:
    build:
      context: .
      dockerfile: cmd/collector/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    networks:
      - analyzer-net

  gateway:
    build:
      context: .
      dockerfile: cmd/gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - COLLECTOR_ADDRESS=collector:8081
    depends_on:
      - collector
    networks:
      - analyzer-net

networks:
  analyzer-net:
    driver: bridge